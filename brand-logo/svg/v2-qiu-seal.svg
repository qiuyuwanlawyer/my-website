<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">邱煜完律师团队方章标识</title>
  <desc id="desc">A seal-style Qiu character mark with legal team initials for formal publishing contexts.</desc>
  <rect width="100" height="100" rx="8" fill="#171615"/>
  <rect x="10" y="10" width="80" height="80" rx="3" fill="none" stroke="#c7a455" stroke-width="2.5"/>
  <text x="50" y="62"
        text-anchor="middle"
        font-family="Songti SC, STSong, Noto Serif CJK SC, SimSun, serif"
        font-size="56"
        font-weight="800"
        fill="#c7a455">邱</text>
  <text x="50" y="79"
        text-anchor="middle"
        font-family="Avenir Next, Inter, Arial, sans-serif"
        font-size="7"
        letter-spacing="1.4"
        fill="#f7f3eb">LEGAL TEAM</text>
</svg>
