  <rect width="900" height="383" fill="#171615"/>
  <rect x="30" y="30" width="840" height="323" fill="none" stroke="#2b2926" stroke-width="2"/>
  <g transform="translate(72 72)">
    <rect width="152" height="152" rx="8" fill="#171615" stroke="#c7a455" stroke-width="4"/>
